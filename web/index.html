    :root {
      --bg-1: #0c1020;
      --bg-2: #141a32;
      --accent-1: #7a4cff;
      --text-1: #e7ebff;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      min-width: 120px;
      color: var(--text-1);
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      height: auto;
      background: transparent;
      border: none;
    }

    .logo-wrap img {
      width: 76px;
      height: 76px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent-1);
      animation: spin 0.85s linear infinite;
    }

    .loading-text {
      font-size: 13px;
      color: rgba(231, 235, 255, 0.72);
      letter-spacing: 0.2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #flutter_container {
      display: none;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* 防止 Flutter canvas 覆盖成白底 */
    canvas {
      background-color: transparent !important;
    }

  <script>

    // Flutter 渲染第一个 frame 后，隐藏 loading
    window.addEventListener("flutter-first-frame", function () {
      document.getElementById("loading").style.display = "none";
      document.getElementById("flutter_container").style.display = "block";

      const loadPixel = function () {
        if (window.__igamesLoadFacebookPixel) {
          window.__igamesLoadFacebookPixel();
        }
      };

      if ("requestIdleCallback" in window) {
        requestIdleCallback(loadPixel, { timeout: 4000 });
      } else {
        setTimeout(loadPixel, 1200);
      }
    });
  </script>
